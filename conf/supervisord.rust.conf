[supervisord]
nodaemon=true
user=root

[program:api]
command=/app/bin/xiezhi-server
autostart=true
autorestart=true
numprocs=1
directory=/app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_maxbytes=0
stderr_maxbytes=0
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=SERVER_PORT="5001",RUST_LOG="info",XIEZHI_DB_FILE="/app/data/data.db"

[program:web]
command=npm run start --prefix /app/web
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_maxbytes=0
stderr_maxbytes=0
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
directory=/app/web
environment=API_PROXY_TARGET="http://127.0.0.1:5001",PORT="5002",HOSTNAME="0.0.0.0"
